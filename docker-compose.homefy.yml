# Homefy.pk local MongoDB only.
# Never point CrazzyCars (vps-test / Coolify) at this database.
#
# Usage:
#   docker compose -f docker-compose.homefy.yml up -d
#
# Connection string (no auth):
#   mongodb://127.0.0.1:27017/homefy

services:
  mongo:
    image: mongo:7
    container_name: homefy-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: homefy
    volumes:
      - homefy-mongo-data:/data/db
    restart: unless-stopped

volumes:
  homefy-mongo-data:
