# Homefy.pk local MongoDB + Postgres.
# Never point CrazzyCars (vps-test / Coolify) at these databases.
#
# Preferred Homefy Mongo (auth + dedicated port):
#   docker compose -f docker-compose.homefy-mongo.yml --env-file .env.homefy.mongo up -d
#   mongodb://homefy:PASSWORD@127.0.0.1:27027/homefy_pk?authSource=admin
#   See docs/HOMEFY-MONGO.md
#
# Legacy unauthenticated local Mongo (port 27017) — prefer the isolated compose above.
#
# Usage (Postgres + legacy mongo):
#   docker compose -f docker-compose.homefy.yml up -d
#
# Mongo:
#   mongodb://127.0.0.1:27017/homefy_pk
# Postgres (optional; store should use CATALOG_BACKEND=mongo for admin product writes):
#   postgresql://postgres:postgres@127.0.0.1:55322/postgres
#
# Port 55322 avoids Mobile_mart local Supabase on 54322.

services:
  mongo:
    image: mongo:7
    container_name: homefy-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: homefy_pk
    volumes:
      - homefy-mongo-data:/data/db
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: homefy-postgres
    ports:
      - "55322:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - homefy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  homefy-mongo-data:
  homefy-postgres-data:
